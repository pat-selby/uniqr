name: C++

on:
  push:
    branches: [main, master]
    paths: ["cpp/**", "tests/fixtures/**", ".github/workflows/cpp.yml"]
  pull_request:
    paths: ["cpp/**", "tests/fixtures/**", ".github/workflows/cpp.yml"]

concurrency:
  group: cpp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'

      - name: Install Ninja
        run: python -m pip install ninja

      - name: Configure
        run: cmake -S cpp -B cpp/build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build cpp/build

      - name: Unit tests
        run: ctest --test-dir cpp/build --output-on-failure

      - name: CLI reads a real photo
        shell: bash
        run: |
          exe=cpp/build/uniqr-scan
          [ "${{ runner.os }}" = "Windows" ] && exe=$exe.exe
          $exe --version
          $exe --json tests/fixtures/small_poster_code.png

      - name: App starts and reports its version
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process cpp/build/src/win/uniqr-cpp.exe -ArgumentList "--version","--quiet" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "uniqr-cpp.exe --version exited $($p.ExitCode)" }

      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: uniqr-cpp-windows
          path: |
            cpp/build/uniqr-scan.exe
            cpp/build/src/win/uniqr-cpp.exe
