name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python: ["3.11", "3.12"]
        exclude:
          # One Python version per OS is enough for detection coverage.
          - os: ubuntu-latest
            python: "3.11"
          - os: macos-latest
            python: "3.11"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install package and dev tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          if [ "${{ runner.os }}" = "Windows" ]; then
            python -m pip install pywin32
          fi
        shell: bash

      - name: Run pytest suite
        run: python -m pytest tests/ --cov=uniqr --cov-report=term-missing

      - name: CLI selftest
        run: python scan.py --selftest

  lint:
    name: Lint and typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dev tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ruff
        run: ruff check uniqr tests app.py scan.py

      - name: Mypy
        run: mypy uniqr
