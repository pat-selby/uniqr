[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uniqr"
version = "0.1.0"
description = "System-wide QR code recognition: scan any code on screen with a hotkey"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Patrick" }]
keywords = ["qr-code", "opencv", "desktop", "screen-capture", "computer-vision"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Environment :: MacOS X",
    "Environment :: X11 Applications",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics :: Capture :: Screen Capture",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
    "opencv-python>=4.10",
    "zxing-cpp>=2.2",
    "numpy>=2.0",
    "pillow>=10.0",
    "mss>=9.0",
    "pynput>=1.7",
    "pystray>=0.19",
    "pyperclip>=1.8",
]

[project.optional-dependencies]
windows = ["pywin32>=306"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-pillow",
]
all = ["uniqr[windows,dev]"]

[project.scripts]
uniqr = "app:main"
uniqr-scan = "scan:main"

[project.urls]
Homepage = "https://github.com/pat-selby/uniqr"
Repository = "https://github.com/pat-selby/uniqr"

[tool.setuptools.packages.find]
include = ["uniqr*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["uniqr", "tests", "app.py", "scan.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
# No python_version pin: mypy then analyses under whichever interpreter
# it runs on. Pinning 3.11 made it read numpy 2.5 stubs as 3.11 code,
# and those stubs use `type` statements that only parse on 3.12+, so
# mypy failed inside numpy rather than anywhere in this project.
packages = ["uniqr"]
ignore_missing_imports = true
warn_return_any = false
warn_unused_ignores = true
disallow_untyped_defs = false

[tool.coverage.run]
source = ["uniqr"]
omit = ["uniqr/shell*.py", "uniqr/overlay.py"]

[tool.ruff.lint.per-file-ignores]
"uniqr/*" = ["SIM105", "B905", "UP035"]
"scan.py" = ["I001"]

[[tool.mypy.overrides]]
module = "uniqr.icon"
disable_error_code = ["arg-type"]

[[tool.mypy.overrides]]
module = "uniqr.decode"
disable_error_code = ["call-overload", "arg-type"]

[[tool.mypy.overrides]]
module = "uniqr.backends"
disable_error_code = ["no-redef"]

[[tool.mypy.overrides]]
module = "uniqr.overlay"
disable_error_code = ["call-arg", "misc"]

[[tool.mypy.overrides]]
module = "uniqr.shell_portable"
disable_error_code = ["attr-defined"]
